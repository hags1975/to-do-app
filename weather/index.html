<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <h1>Weather</h1>
    <p class="subtitle">Check the current weather for any city.</p>

    <div class="weather-card">
      <label class="visually-hidden" for="city-input">City name</label>
      <div class="search-row">
        <input type="text" id="city-input" placeholder="Enter a city, e.g. Stockholm">
        <button class="btn" id="get-weather-btn" type="button">Get Weather</button>
      </div>

      <p class="clothing-label">What are you wearing?</p>
      <div class="clothing-row" role="group" aria-label="Clothing level">
        <button class="clothing-btn" data-level="light" type="button">Light</button>
        <button class="clothing-btn active" data-level="medium" type="button">Medium</button>
        <button class="clothing-btn" data-level="heavy" type="button">Heavy</button>
      </div>

      <p class="status" id="status" aria-live="polite"></p>
      <div class="result" id="result" hidden>
        <h2 id="result-city"></h2>
        <p class="temp" id="result-temp"></p>
        <p class="detail" id="result-description"></p>
        <p class="detail" id="result-wind"></p>
        <p class="detail" id="result-humidity"></p>
        <p class="comfort" id="result-comfort" aria-live="polite"></p>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const button = document.getElementById("get-weather-btn");
      const status = document.getElementById("status");
      let scriptRequested = false;

      button.addEventListener("click", () => {
        if (scriptRequested) {
          return;
        }
        scriptRequested = true;

        button.disabled = true;
        status.textContent = "Loading weather app...";

        const script = document.createElement("script");
        script.src = "script.js";
        script.onload = () => {
          button.disabled = false;
          button.click();
        };
        script.onerror = () => {
          scriptRequested = false;
          status.textContent = "Failed to load weather. Please try again.";
          button.disabled = false;
        };
        document.head.appendChild(script);
      });
    })();
  </script>
</body>
</html>
